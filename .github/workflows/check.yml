# Checks every change on GitHub: the strict type check, the code checks (ESLint), the formatting
# (Prettier), the unit tests, a full build and every browser test, on a fresh machine each time.
# A red cross on a commit means one of them failed; open the run to see which (the browser tests'
# screenshots and logs are attached when they fail). The built site files are attached to every
# run that gets that far.
#
# When everything passes on main, the site is published (GitHub Pages), so a change that fails a
# check never reaches the phones. (Once, in the repository's Settings → Pages, set Source to
# "GitHub Actions".)
name: Check

on:
  push:
  pull_request:
  workflow_dispatch: # a "Run workflow" button on the Actions tab

permissions:
  contents: read

# A newer push to the same branch replaces a run that's still going.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      made_lock: ${{ steps.install.outputs.made_lock }}
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Exact versions from package-lock.json once it's committed; until then, the newest that
      # package.json allows (and the lock file made is attached at the end if everything passed).
      - name: Install
        id: install
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
            echo "made_lock=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Type check
        run: npm run typecheck

      - name: Code checks (ESLint)
        run: npm run lint

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build:single

      - name: Site files
        uses: actions/upload-artifact@v4
        with:
          name: site-files
          path: dist-single/
          retention-days: 30

      - name: Browser for the tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: node tests/e2e/run.mjs dist-single --jobs 2

      - name: Browser test screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: tests/e2e/.out/
          retention-days: 14

      # No package-lock.json in the repository yet: here's one from a run where everything passed.
      # Commit it next to package.json so every later run (and every install) uses these versions.
      - name: Lock file to commit
        if: success() && steps.install.outputs.made_lock == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 30

  # Put the site online: the files the checks just built and tested, only from main.
  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-files
          path: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

  # No package-lock.json yet: commit the one from this run, where every check passed, so every
  # later run installs exactly the versions that were tested. A separate job, so the job that
  # installs and runs packages never has permission to change the repository.
  save-lock:
    needs: check
    if: needs.check.outputs.made_lock == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: package-lock

      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Pin package versions: package-lock.json from a run where every check passed"
          git push
